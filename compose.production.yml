services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_tours}
      POSTGRES_USER: ${POSTGRES_USER:-tour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-tour}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-virtual_tours}?sslmode=disable
      ASSET_PROCESSOR_SCRIPT: /app/asset-tools/process.mjs
      ASSET_SPLAT_WALKING: ${ASSET_SPLAT_WALKING:-off}
      ASSET_SPLAT_STREAMING: ${ASSET_SPLAT_STREAMING:-off}
      ASSET_SPLAT_SUPPORT: ${ASSET_SPLAT_SUPPORT:-off}
      ASSET_CHUNK_STREAMING: ${ASSET_CHUNK_STREAMING:-off}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: production
      args:
        VITE_SPLAT_WALKING: ${VITE_SPLAT_WALKING:-off}
        VITE_SPLAT_STREAMING: ${VITE_SPLAT_STREAMING:-off}
        VITE_SPLAT_SUPPORT: ${VITE_SPLAT_SUPPORT:-off}
    restart: unless-stopped

  # This is also the HTTP challenge service used by certbot.sh.
  challenge:
    image: nginx:1.28-alpine
    restart: unless-stopped
    entrypoint: [/bin/sh, /opt/proxy/start.sh]
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN}
      TLS_CERT_FILE: ${TLS_CERT_FILE:?Set TLS_CERT_FILE}
      TLS_KEY_FILE: ${TLS_KEY_FILE:?Set TLS_KEY_FILE}
    ports:
      - "${CERTBOT_BIND_ADDRESS:-0.0.0.0}:${CERTBOT_HTTP_PORT:-80}:80"
      - "${CERTBOT_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/proxy:/opt/proxy:ro
      - ${CERTBOT_DATA_DIR:-./data/certbot}/etc:/etc/letsencrypt:ro
      - ${CERTBOT_DATA_DIR:-./data/certbot}/webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - api
      - web

  certbot:
    extends:
      file: compose.certbot.yml
      service: certbot

  renew:
    extends:
      file: compose.certbot.yml
      service: renew

volumes:
  # Same service/volume name as development; the Compose project controls reuse.
  postgres_data:
