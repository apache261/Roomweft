services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_tours}
      POSTGRES_USER: ${POSTGRES_USER:-tour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tour-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tour-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-tour-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - minio_data:/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MINIO_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001"
  minio-init:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: mc
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tour-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tour-local-secret}
      S3_BUCKET: ${S3_BUCKET:-virtual-tours}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        attempt=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET" && mc anonymous set none "local/$$S3_BUCKET"
  api:
    build: .
    env_file:
      - .env
    environment:
      ASSET_PROCESSOR_SCRIPT: /app/asset-tools/process.mjs
      ASSET_SPLAT_SUPPORT: ${ASSET_SPLAT_SUPPORT:-off}
      ASSET_CHUNK_STREAMING: ${ASSET_CHUNK_STREAMING:-off}
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-tour}:${POSTGRES_PASSWORD:-tour-local-only}@postgres:5432/${POSTGRES_DB:-virtual_tours}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-virtual-tours}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tour-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tour-local-secret}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  web:
    build:
      context: ./web
      args:
        VITE_SPLAT_SUPPORT: ${VITE_SPLAT_SUPPORT:-off}
    environment:
      VITE_SPLAT_SUPPORT: ${VITE_SPLAT_SUPPORT:-off}
      API_PROXY_TARGET: http://api:8080
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-5173}:5173"
    depends_on:
      - api
volumes:
  postgres_data:
  minio_data:
